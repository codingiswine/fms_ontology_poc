<svg width="1300" height="720" viewBox="0 0 1300 720" xmlns="http://www.w3.org/2000/svg" font-family="'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arP" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect width="1300" height="720" fill="#ffffff"/>
  <text x="650" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#0f172a">FMS 온톨로지 PoC — 전체 아키텍처</text>

  <!-- 구조화 파이프라인 -->
  <rect x="60" y="80" width="560" height="260" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="80" y="108" font-size="14.5" font-weight="700" fill="#1e40af">구조화 파이프라인 (automatic_classification.py)</text>

  <rect x="90" y="130" width="220" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="200" y="160" text-anchor="middle" font-size="12.5" fill="#0f172a">업무일지 CSV (자유서술형)</text>

  <line x1="200" y1="180" x2="200" y2="205" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="90" y="205" width="220" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="200" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">정규식 + Pandas 파싱</text>
  <text x="200" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">장소·작업자·시간·업무·자재 추출</text>

  <line x1="200" y1="255" x2="200" y2="280" stroke="#2563eb" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="90" y="280" width="220" height="50" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="200" y="303" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">RDF 트리플 생성</text>
  <text x="200" y="321" text-anchor="middle" font-size="10.5" fill="#64748b">rdflib · Work/Worker/Location/...</text>

  <!-- Protégé -->
  <rect x="360" y="130" width="230" height="200" rx="10" fill="#fefce8" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="380" y="158" font-size="13.5" font-weight="700" fill="#854d0e">Protégé (외부 도구)</text>
  <text x="380" y="185" font-size="11.5" fill="#334155">FMS 온톨로지 설계</text>
  <text x="380" y="205" font-size="11.5" fill="#334155">네임스페이스: linkfms.kr/ontology/fms</text>
  <text x="380" y="230" font-size="11.5" fill="#334155">개체: Work · Worker · Location</text>
  <text x="380" y="250" font-size="11.5" fill="#334155">Plan · Material · Date · Time</text>
  <text x="380" y="280" font-size="11" fill="#92400e" font-weight="600">→ 스키마를 파싱 단계에 제공</text>

  <line x1="360" y1="230" x2="310" y2="255" stroke="#ca8a04" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#ar)"/>

  <line x1="200" y1="330" x2="200" y2="380" stroke="#2563eb" stroke-width="1.8" marker-end="url(#ar)"/>

  <!-- RDF Graph store -->
  <rect x="90" y="380" width="500" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.6"/>
  <text x="340" y="413" text-anchor="middle" font-size="13" font-weight="600" fill="#1e3a8a">RDF 그래프 저장 (.ttl / .rdf, 로컬 스냅샷)</text>

  <!-- Query interface -->
  <rect x="680" y="80" width="560" height="260" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.6"/>
  <text x="700" y="108" font-size="14.5" font-weight="700" fill="#15803d">질의 인터페이스 (2sparql_gpt.py)</text>

  <rect x="710" y="130" width="230" height="50" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="825" y="160" text-anchor="middle" font-size="12.5" fill="#0f172a">사용자 자연어 질문</text>

  <line x1="825" y1="180" x2="825" y2="205" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="710" y="205" width="230" height="50" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="825" y="228" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">GPT-4o (예시 기반 프롬프트)</text>
  <text x="825" y="246" text-anchor="middle" font-size="10.5" fill="#64748b">자연어 → SPARQL SELECT 변환</text>

  <line x1="825" y1="255" x2="825" y2="280" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="710" y="280" width="230" height="50" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="825" y="303" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">rdflib graph.query()</text>
  <text x="825" y="321" text-anchor="middle" font-size="10.5" fill="#64748b">SPARQL 실행 → RDF 그래프 조회</text>

  <line x1="590" y1="407" x2="710" y2="305" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>

  <rect x="980" y="180" width="230" height="55" rx="7" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="1095" y="205" text-anchor="middle" font-size="11.5" font-weight="600" fill="#0f172a">질의 결과 원문 반환</text>
  <text x="1095" y="222" text-anchor="middle" font-size="10" fill="#64748b">(변수:값 그대로, 자연어 답변 없음)</text>

  <line x1="940" y1="305" x2="1095" y2="235" stroke="#16a34a" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- Visualization -->
  <rect x="90" y="460" width="500" height="90" rx="10" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
  <text x="110" y="488" font-size="13.5" font-weight="700" fill="#6b21a8">그래프 시각화 (3pyvis.py, 4pyvis_search.py)</text>
  <text x="110" y="512" font-size="11.5" fill="#334155">pyvis 인터랙티브 HTML — 노드 검색·하이라이트·자동 포커스</text>
  <text x="110" y="533" font-size="10.5" fill="#7e22ce">RDF 그래프 → 브라우저에서 관계 탐색</text>

  <line x1="200" y1="435" x2="200" y2="460" stroke="#9333ea" stroke-width="1.6" marker-end="url(#arP)"/>

  <!-- Roadmap -->
  <rect x="620" y="460" width="620" height="130" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="1.3" stroke-dasharray="5,3"/>
  <text x="640" y="488" font-size="13" font-weight="700" fill="#9a3412">다음 단계로 설계 (미착수)</text>
  <text x="640" y="513" font-size="12" fill="#7c2d12">· SPARQL 결과를 자연어로 후처리하는 Answer Agent화</text>
  <text x="640" y="536" font-size="12" fill="#7c2d12">· 자동 추출 정확도 향상을 위한 NER/ML 모델 도입</text>
  <text x="640" y="559" font-size="12" fill="#7c2d12">· 관계 시각화 대시보드 웹앱 전환</text>
  <text x="640" y="580" font-size="10.5" fill="#9a3412">※ 현재는 원문 결과만 반환 — 자연어 챗봇 아님</text>
</svg>
